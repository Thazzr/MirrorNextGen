openapi: 3.0.3
info:
  title: MirrorNextGen API
  version: 0.1.0
  description: API of the MirrorNextGen smart mirror server.
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Liveness check
      description: Returns ok while the server is able to answer requests. Used by the Docker healthcheck.
      responses:
        "200":
          description: The server is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/info:
    get:
      operationId: getInfo
      summary: Build information
      description: Returns the version, commit and build time of the running server.
      responses:
        "200":
          description: Build information of the running server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Info"
  /api/v1/auth/session:
    get:
      operationId: getSession
      summary: Current session state
      description: >-
        Tells the web app whether the admin access still has to be set up and whether
        the caller is signed in. The CSRF token is only returned to a signed-in caller.
      responses:
        "200":
          description: The session state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
  /api/v1/auth/setup:
    post:
      operationId: setupAdmin
      summary: Set the admin password
      description: >-
        Sets the admin password on first start and signs the caller in. Only possible
        while no admin password is set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRequest"
      responses:
        "200":
          description: The password was set and a session was started.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Sign in
      description: >-
        Signs in with the admin password. After five failed attempts within fifteen
        minutes the client address is blocked until the oldest failure expires.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRequest"
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          description: Too many failed attempts.
          headers:
            Retry-After:
              description: Seconds until the next attempt is allowed.
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Sign out
      description: Ends the current session and expires the session cookie.
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/auth/password:
    post:
      operationId: changePassword
      summary: Change the admin password
      description: >-
        Changes the admin password. All other sessions are ended, the current one stays.
        A wrong current password does not count towards the login throttle.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: The password was changed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/settings/display:
    get:
      operationId: getDisplaySettings
      summary: Display settings
      description: Returns the stored display settings (rotation, output, test pattern).
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The stored display settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisplaySettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: updateDisplaySettings
      summary: Change the display settings
      description: >-
        Validates and stores the display settings. Invalid values answer 400 with
        `errors` keyed by field name (`rotation`, `output`); nothing is stored then.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisplaySettings"
      responses:
        "200":
          description: The stored display settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisplaySettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/kiosk/state:
    get:
      operationId: getKioskState
      summary: Target state of the kiosk
      description: >-
        Returns what the kiosk agent applies to the screen. Public, because the kiosk
        container and the dashboard read it without a session; it contains no secrets.
      responses:
        "200":
          description: The target state of the screen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KioskState"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: mirror_session
      description: >-
        Session cookie set by setup and login. Unsafe methods also need the session's
        CSRF token in the X-CSRF-Token header. Enforced by a server middleware that
        denies every operation not explicitly listed as public.
  headers:
    SetCookie:
      description: Sets or expires the mirror_session cookie.
      schema:
        type: string
  responses:
    BadRequest:
      description: The request is invalid; `errors` names the offending fields.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Not signed in, or the credentials are wrong.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The CSRF token is missing or wrong.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The request does not fit the current state of the admin access.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Health:
      type: object
      description: Result of the liveness check.
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Info:
      type: object
      description: Build information of the server binary.
      required: [version, commit, buildTime]
      properties:
        version:
          type: string
          description: Release version, "dev" for local builds.
        commit:
          type: string
          description: Git commit the binary was built from, "unknown" when not known.
        buildTime:
          type: string
          description: Build time as ISO 8601 timestamp, empty when unknown.
    Problem:
      type: object
      description: Error body, served as application/problem+json.
      required: [title, status]
      properties:
        title:
          type: string
          description: Short, human-readable summary of the problem.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Explanation specific to this occurrence.
        errors:
          type: object
          description: Validation messages by field name.
          additionalProperties:
            type: string
    Session:
      type: object
      description: State of the caller's admin session.
      required: [setupRequired, authenticated]
      properties:
        setupRequired:
          type: boolean
          description: True while no admin password is set.
        authenticated:
          type: boolean
          description: True when the caller has a valid session.
        csrfToken:
          type: string
          description: Token for the X-CSRF-Token header, only present when authenticated.
    PasswordRequest:
      type: object
      description: A password to set or to sign in with.
      required: [password]
      properties:
        password:
          type: string
    ChangePasswordRequest:
      type: object
      description: Current and new admin password.
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
    DisplaySettings:
      type: object
      description: Settings of the mirror's screen.
      required: [rotation, output, testPattern]
      properties:
        rotation:
          type: integer
          enum: [0, 90, 180, 270]
          description: Rotation in degrees clockwise.
        output:
          type: string
          description: Connector name such as HDMI-A-1; empty means automatic.
        testPattern:
          type: boolean
          description: Shows the diagnose overlay on the mirror.
    KioskState:
      type: object
      description: Target state of the screen as the kiosk agent applies it.
      required: [rotation, output, testPattern]
      properties:
        rotation:
          type: integer
          enum: [0, 90, 180, 270]
          description: Rotation in degrees clockwise.
        output:
          type: string
          description: Connector name such as HDMI-A-1; empty means automatic.
        testPattern:
          type: boolean
          description: Shows the diagnose overlay on the mirror.
